# ERIA package description (orchestrator catalog, eria-manager DESIGN §12.3)
name: service-weather
title: Météo
description: Conditions actuelles depuis Open-Meteo (température, humidité, pression, vent, UV), sans clé d'API
kind: service
requires: []

exec:
  args: ["--config-path", "{config}"]
  health: { url: "http://127.0.0.1:{port}/eria", grace: 20s, interval: 10s }

config: |
  host: 0.0.0.0
  port: 8102
  location: Europe/Paris
  lat: <latitude>
  long: <longitude>
  rate: 900
